name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --extra preview: mypy checks preview.py, which imports fastapi/uvicorn
        run: uv sync --extra preview --group dev --group test

      - name: Lint (ruff)
        run: |
          uv run ruff check openapi_burrito tests
          uv run ruff format --check openapi_burrito tests

      - name: Type-check (mypy)
        run: uv run mypy openapi_burrito tests

      - name: Test (pytest)
        run: uv run pytest --cov=openapi_burrito
